name: Update Premierliga Data & Deploy

on:
  schedule:
    - cron: "0 7 * * 1"    # Понедельник 10:00 МСК = 07:00 UTC
    - cron: "0 20 * * 4"   # Четверг 23:00 МСК = 20:00 UTC
  workflow_dispatch:        # ручной запуск + Google Script
  repository_dispatch:      # ← для Google Script
    types: [scheduled-check, manual-trigger]

# Важно: для деплоя на Pages нужны эти разрешения
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-premierliga
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper/main.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase -X theirs origin main
            git push
          fi

      # === НОВЫЕ ШАГИ ДЛЯ ДЕПЛОЯ ===
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Укажите папку, которую нужно опубликовать (например, ./dist, ./public или корень ".")
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
