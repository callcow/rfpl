name: Update Premierliga Data & Deploy

on:
  schedule:
    - cron: "0 7 * * 1"
    - cron: "0 20 * * 4"
  workflow_dispatch:
  repository_dispatch:
    types: [scheduled-check, manual-trigger]

permissions:
  contents: write # Этого достаточно для пуша в gh-pages

concurrency:
  group: update-premierliga
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper/main.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase -X theirs origin main
            git push
          fi

      # === ЗАМЕНА: Деплой через ветку gh-pages ===
      - name: Deploy to GitHub Pages (via gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .   # Укажите папку, которую нужно опубликовать (например, './public' или '.')
          publish_branch: gh-pages # Ветка, куда будут пушиться файлы
          # Опционально: чтобы избежать ошибок с правами, можно указать пользователя
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
