name: Update Premierliga Data

on:
  schedule:
    - cron: "0 7 * * 1"    # Понедельник 10:00 МСК = 07:00 UTC
    - cron: "0 20 * * 4"   # Четверг 23:00 МСК = 20:00 UTC
  workflow_dispatch:        # ручной запуск + Google Script
  repository_dispatch:      # ← для Google Script (dёргает по next_run.json)
    types: [scheduled-check, manual-trigger]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python main.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi